name: Scramble 2026 entry stats

# Fetches the Hyvinkää Scramble entry list twice a day and commits the
# aggregated counts. Cloudflare rebuilds on the commit, so /fi/scramble-2026
# updates itself.
#
# Twice a day, morning and evening Helsinki time. Two cron entries per slot,
# and deliberately NOT on the hour. Both details are load-bearing:
#
# 1. Never use minute 0. On 10.8.2026 the 06:00 run never fired at all — no run
#    record, no log. mxgp-scraper.yml is also due at '0 6' on Mondays, and that
#    was the first slot where the two collided. Every slot where this workflow
#    was alone had fired; the one shared slot dropped it. Do not schedule
#    anything else in this repo at '25 5', '25 6', '25 17' or '25 18'.
#
# 2. Two entries per slot. GitHub does not guarantee scheduled runs and gives no
#    notification when it skips one, so a single trigger is a single point of
#    failure. The second entry is a free retry an hour later. A duplicate run is
#    harmless because snapshots are keyed on date + slot and a re-run replaces
#    its own slot rather than adding a third point.
#
# Helsinki is UTC+3 in summer (EEST), so 05:25/06:25 UTC is 08:25/09:25 local
# and 17:25/18:25 UTC is 20:25/21:25 local. The event is in August, so summer
# time holds throughout and the offset never changes. Note the slot boundary in
# the script is 12:00 Helsinki, leaving over three hours of headroom for the
# queueing delay — runs routinely start 40-60 minutes late.
#
# The page no longer promises specific clock times, precisely because of that
# delay. It says "Päivittyy kaksi kertaa päivittäin" and stamps each snapshot
# with the time it was really taken.
#
# Scraping etiquette: at most four requests a day, identifying User-Agent. The
# source is a public entry list on a small club site — do not raise this.
#
# Only counts are committed, never names. See scripts/scrape-scramble.mjs.

on:
  schedule:
    - cron: '25 5,17 * * *'
    - cron: '25 6,18 * * *'
  # Lets us run it by hand from the Actions tab — used to verify the first run
  # before trusting the schedule.
  workflow_dispatch:

concurrency:
  group: scramble-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Scrape entry list
        run: node scripts/scrape-scramble.mjs

      - name: Commit snapshot
        run: |
          git config user.name "photoandmoto-publisher[bot]"
          git config user.email "photoandmoto-publisher[bot]@users.noreply.github.com"
          git add public/data/scramble-2026.json

          if git diff --staged --quiet; then
            echo "No change since the last run — nothing to commit."
            exit 0
          fi

          git commit -m "chore(scramble): entry stats $(date -u +%Y-%m-%d)"
          # Another job may have pushed while this one ran; rebase rather than fail.
          git pull --rebase origin main
          git push origin main
