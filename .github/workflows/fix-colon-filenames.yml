name: Fix colon filenames (one-off)

# ONE-OFF cleanup. Three files in the suomi-70s gallery have a colon (:) in
# their names — published directly to `main` before filename sanitization. A
# colon is illegal on Windows/NTFS, so the repo can't be checked out on Windows.
# This job renames them (drops the colon) and updates the matching path fields in
# the gallery manifest, committing directly to `main` via the Photoandmoto
# Publisher GitHub App (which is allowed to push to the protected `main` branch).
# The Linux runner handles the colon filenames fine during checkout.
#
# It runs once when this file is pushed to `dev` (the push trigger is scoped to
# this file, so it won't fire on unrelated dev pushes), and is also manually
# runnable. It is idempotent — if the colon files are already gone it does
# nothing. DELETE this workflow file once it has run successfully.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-colon-filenames.yml'

concurrency:
  group: fix-colon-filenames
  cancel-in-progress: false

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Rename colon files + fix manifest path fields
        run: |
          set -euo pipefail
          git config core.quotePath false

          G="public/galleries/suomi-70s"
          OLD="HyMK:n valmennusryhmä Hyvinkää, Sveitsin uimala 1978"
          NEW="HyMKn valmennusryhmä Hyvinkää, Sveitsin uimala 1978"

          changed=0

          if [ -f "$G/${OLD}.jpg" ]; then
            git mv "$G/${OLD}.jpg" "$G/${NEW}.jpg"
            changed=1
          fi
          if [ -f "$G/thumbs/${OLD}_thumb.jpg" ]; then
            git mv "$G/thumbs/${OLD}_thumb.jpg" "$G/thumbs/${NEW}_thumb.jpg"
            changed=1
          fi
          if [ -f "$G/display/${OLD}_display.jpg" ]; then
            git mv "$G/display/${OLD}_display.jpg" "$G/display/${NEW}_display.jpg"
            changed=1
          fi

          MANIFEST="src/content/galleries/suomi-70s.json"
          # Remove the colon ONLY from the path fields (filename/thumb/display)
          # of entries whose filename contains one. Caption text is left as-is.
          if jq -e '.images[]? | select(.filename and (.filename | test(":")))' "$MANIFEST" >/dev/null 2>&1; then
            tmp="$(mktemp)"
            jq '(.images[]? | select(.filename and (.filename | test(":"))))
                  |= (.filename |= gsub(":"; "")
                      | .thumb   |= gsub(":"; "")
                      | .display |= gsub(":"; ""))' \
              "$MANIFEST" > "$tmp"
            mv "$tmp" "$MANIFEST"
            changed=1
          fi

          echo "changed=$changed" >> "$GITHUB_ENV"
          echo "Renamed/updated: $changed"

      - name: Commit + push to main
        if: env.changed == '1'
        run: |
          set -euo pipefail
          git config user.name "photoandmoto-publisher[bot]"
          git config user.email "photoandmoto-publisher[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing staged — already clean."
            exit 0
          fi
          # The "chore(gallery): move " prefix is in process-gallery-image.yml's
          # loop guard, so this rename won't trigger the gallery processor.
          git commit -m "chore(gallery): move colon-named suomi-70s files to Windows-safe names"
          git push origin main
          echo "Renamed colon files on main + fixed manifest. Production will rebuild."

      - name: Already clean
        if: env.changed != '1'
        run: echo "No colon files found on main — nothing to do."
