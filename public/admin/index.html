<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Photo &amp; Moto — Artikkeli-CMS</title>
    <link rel="icon" href="/favicon.png" />

    <!-- Same Montserrat load as the live site (matches BaseLayout.astro). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Photo & Moto branding overlays for Decap's UI chrome. -->
    <link rel="stylesheet" href="/admin/branding.css" />

    <style>
      /*
       * Make text-input fields render in Montserrat so what you type looks
       * close to what'll appear on the live site. Decap's UI chrome (sidebar,
       * buttons, icons) stays in its default font — overriding everything
       * breaks Decap's icon fonts.
       *
       * !important is needed because Decap's styled-components set inline
       * styles that would otherwise win.
       */
      input[type='text'],
      input[type='search'],
      input[type='url'],
      input[type='email'],
      textarea,
      [contenteditable='true'],
      [contenteditable='true'] *,
      .cms-editor-visual,
      .cms-editor-visual * {
        font-family: 'Montserrat', system-ui, sans-serif !important;
      }

      /*
       * Raw markdown mode (CodeMirror) intentionally stays monospace —
       * it's easier to spot whitespace and align code blocks.
       */
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.6.3/dist/decap-cms.js"></script>
    <script>
      /*
       * Custom Finnish (fi) locale for Decap CMS.
       *
       * Decap ships 33 locales but Finnish is not one of them, so without
       * this registration `locale: fi` in config.yml silently falls back to
       * English. This block registers a partial Finnish translation focused
       * on the strings non-technical editors actually see (toolbar buttons,
       * confirmation dialogs, sidebar labels, common UI). Any key not in
       * this object falls back to Decap's English default automatically.
       *
       * If a string looks wrong or English leaks through somewhere editors
       * see it, add the key here. The full key tree lives in Decap's source:
       *   github.com/decaporg/decap-cms/tree/main/packages/decap-cms-locales/src/en
       */

        app: {
          header: {
            content: 'Sisältö',
            workflow: 'Työnkulku',
            media: 'Media',
            quickAdd: 'Pikalisäys',

            configErrors: 'Konfiguraatiovirheet',

            waitingBackend: 'Odotetaan taustajärjestelmää…',

          notFoundPage: {

          },
          collection: {
            sidebar: {

              allCollections: 'Kaikki kokoelmat',
              searchAll: 'Hae kaikista',
              searchIn: 'Hae kohteesta',
            },
            collectionTop: {
              sortBy: 'Lajittele',
              viewAs: 'Näkymä',
              newButton: 'Uusi %{collectionLabel}',
              ascending: 'Nouseva',
              descending: 'Laskeva',
              searchResults: 'Hakutulokset haulle "%{searchTerm}"',
              searchResultsInCollection: 'Hakutulokset haulle "%{searchTerm}" kokoelmasta %{collection}',
              filterBy: 'Suodata',
              groupBy: 'Ryhmittele',
            },
            entries: {
              loadingEntries: 'Ladataan artikkeleita…',
              cachingEntries: 'Tallennetaan välimuistiin…',
              longerLoading: 'Tämä voi kestää muutaman minuutin',
              noEntries: 'Ei artikkeleita',
            },
            groups: {
              other: 'Muu',
              negateLabel: 'Ei %{label}',
            },
            defaultFields: {
              author: { label: 'Kirjoittaja' },

          },
          editor: {
            editorControl: {
              field: { optional: 'valinnainen' },
            },
            editorControlPane: {
              widget: {
                required: '%{fieldLabel} on pakollinen.',
                regexPattern: '%{fieldLabel} ei vastaa muotoa: %{pattern}.',
                processing: 'Käsitellään kenttää %{fieldLabel}.',
                range: '%{fieldLabel} on oltava välillä %{minValue} – %{maxValue}.',
                min: '%{fieldLabel} on oltava vähintään %{minValue}.',
                max: '%{fieldLabel} on oltava enintään %{maxValue}.',
                rangeCount: '%{fieldLabel} kohteita on oltava %{minCount} – %{maxCount}.',

              },

                copyFromLocaleConfirm: 'Haluatko täyttää tiedot kielestä %{locale}? Olemassa olevat tiedot korvataan.',
              },
            },

            },
            editorToolbar: {

                heading: 'Palautettu artikkeli',
                warning: 'Kopioi tämä jonnekin ennen sivulta poistumista!',
                copyButtonLabel: 'Kopioi leikepöydälle',
              },
            },
            settingsDropdown: {
              logOut: 'Kirjaudu ulos',
            },
            toast: {
              onFailToLoadEntries: 'Artikkelin lataus epäonnistui: %{details}',
              onFailToLoadDeployPreview: 'Esikatselun lataus epäonnistui: %{details}',
              onFailToPersist: 'Artikkelin tallennus epäonnistui: %{details}',
              onFailToDelete: 'Artikkelin poisto epäonnistui: %{details}',
              onFailToUpdateStatus: 'Tilan päivitys epäonnistui: %{details}',
              missingRequiredField: 'Hups, unohdit pakollisen kentän. Et voi tallentaa ennen kuin se on täytetty.',
              entrySaved: 'Artikkeli tallennettu',
              entryPublished: 'Artikkeli julkaistu',
              entryUnpublished: 'Artikkelin julkaisu peruttu',
              onFailToPublishEntry: 'Julkaisu epäonnistui: %{details}',
              onFailToUnpublishEntry: 'Julkaisun peruminen epäonnistui: %{details}',
              entryUpdated: 'Artikkelin tila päivitetty',
              onDeleteUnpublishedChanges: 'Julkaisemattomat muutokset poistettu',
              onFileUploadError: 'Tiedoston lähetys epäonnistui: %{details}',
              onDeletePublishedEntry: 'Julkaistu artikkeli poistettu',
              loadingEntries: 'Ladataan artikkeleita…',
            },
          },
        },
      });

      // Mirror the live site's typography + layout in Decap's preview pane.
      CMS.registerPreviewStyle('/admin/preview.css');
    </script>
    <!-- Custom preview template that mirrors src/layouts/ArticleLayout.astro -->
    <script src="/admin/preview.js"></script>
  </body>
</html>
