<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Photo &amp; Moto — Artikkeli-CMS</title>
    <link rel="icon" href="/favicon.png" />

    <!-- Same Montserrat load as the live site (matches BaseLayout.astro). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

    <style>
      /*
       * Make text-input fields render in Montserrat so what you type looks
       * close to what'll appear on the live site. Decap's UI chrome (sidebar,
       * buttons, icons) stays in its default font — overriding everything
       * breaks Decap's icon fonts.
       *
       * !important is needed because Decap's styled-components set inline
       * styles that would otherwise win.
       */
      input[type='text'],
      input[type='search'],
      input[type='url'],
      input[type='email'],
      textarea,
      [contenteditable='true'],
      [contenteditable='true'] *,
      .cms-editor-visual,
      .cms-editor-visual * {
        font-family: 'Montserrat', system-ui, sans-serif !important;
      }

      /*
       * Raw markdown mode (CodeMirror) intentionally stays monospace —
       * it's easier to spot whitespace and align code blocks.
       */
    </style>
  </head>
  <body>
    <!-- Pinned to a known-good version (2026-07-12). v0.170.6 shipped a
         template regression (Svelte `@const` -> `const` conversion) that
         crashes field-editor.svelte for any field with a `hint:` option —
         every Artikkelit field (featured_image_focus, card_image_focus,
         sources) hits this; Pikauutiset has no `hint:` fields and was
         unaffected. Fixed by revert in v0.170.7. Loading unpinned "latest"
         means any future upstream regression breaks the editor here with
         zero warning — pin and bump deliberately after testing instead. -->
    <script src="https://unpkg.com/@sveltia/cms@0.170.7/dist/sveltia-cms.js"></script>
  </body>
</html>
