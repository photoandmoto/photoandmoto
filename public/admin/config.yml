# Photo & Moto — Decap CMS configuration
# Article CRUD only. Mystery photos and galleries are managed via /fi/yllapito.

backend:
  name: github
  repo: photoandmoto/photoandmoto
  branch: dev
  base_url: https://www.photoandmoto.fi
  auth_endpoint: oauth/auth

# Set to false (or remove) for production. With local_backend: true and
# `npx decap-server` running locally, the CMS edits files on disk instead
# of committing to GitHub — useful for config/iteration without OAuth.
local_backend: true

# Direct commits to the `main` branch (production). No PR-based editorial
# workflow — editor saves → commits to main → Cloudflare rebuilds production
# in ~2 min. Decap's built-in preview pane is the review step. Code changes
# by developers still go through `dev` with a manual `dev → main` PR.
publish_mode: simple

site_url: https://www.photoandmoto.fi
display_url: https://www.photoandmoto.fi
logo_url: https://www.photoandmoto.fi/images/logo.png
locale: fi

# Media uploads land in /public/images/ and are referenced as /images/<file>.
media_folder: public/images
public_folder: /images

# Normalize slugs to ASCII so Finnish titles produce clean filenames
# (ä -> a, ö -> o, å -> a, etc.). Without this, Decap keeps Unicode chars
# in filenames, which causes URL-encoding issues and inconsistent diffs.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Top-level i18n configuration — applies to any collection that opts in.
i18n:
  structure: multiple_folders
  locales: [fi, en]
  default_locale: fi

collections:
  - name: articles
    label: Artikkelit
    label_singular: Artikkeli
    description: 'Suomeksi (fi) ja englanniksi (en). Tiedoston nimi = URL-slug, sama molemmissa kielissä.'
    folder: src/content/articles
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}} ({{category}})'
    sortable_fields: [date, title, category]
    view_filters:
      - { label: 'Piilotetut (luonnos)', field: draft, pattern: true }
    view_groups:
      - { label: 'Kategoria', field: category }
      - label: 'Julkaisuvuosi'
        field: date
        pattern: '\d{4}'
    i18n: true
    fields:
      - { name: title, label: Otsikko, widget: string, i18n: true }
      - { name: subtitle, label: Alaotsikko, widget: string, required: false, i18n: true }
      - { name: author, label: Kirjoittaja, widget: string, default: 'Photo & Moto', i18n: duplicate }
      - { name: date, label: Päivämäärä, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, i18n: duplicate }
      - name: category
        label: Kategoria
        widget: relation
        collection: categories
        value_field: name
        search_fields: [name, label]
        display_fields: [label]
        i18n: duplicate
        hint: 'Jos sopivaa kategoriaa ei löydy, lisää uusi vasemman sivupalkin Kategoriat-osiosta.'
      - { name: tags, label: Avainsanat, widget: list, default: [], required: false, i18n: true }
      - { name: featured_image, label: 'Pääkuva (hero)', widget: image, required: false, i18n: duplicate }
      - { name: card_image, label: 'Korttikuva (lista- ja etusivut)', widget: image, required: false, i18n: duplicate }
      - { name: show_hero, label: 'Näytä pääkuva otsikon yläpuolella', widget: boolean, default: true, required: false, i18n: duplicate }
      - { name: image_caption, label: 'Pääkuvan kuvateksti', widget: string, required: false, i18n: true }
      - { name: draft, label: 'Piilota sivustolta', widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: seo_description, label: 'SEO-kuvaus (max 160 merkkiä)', widget: string, required: false, pattern: ['^.{0,160}$', 'Korkeintaan 160 merkkiä'], i18n: true }
      - { name: body, label: Sisältö, widget: markdown, i18n: true }
      - { name: sources, label: 'Lähteet (valinnainen)', widget: text, required: false, i18n: true, hint: 'Lähteet, joista materiaalia on lainattu. Jokainen lähde omalla rivillä. URL-osoitteet muuttuvat automaattisesti linkeiksi.' }

  # ============================================================
  # Shadow collections: pre-filled article templates.
  # Both write to src/content/articles/ — same folder as Artikkelit above.
  # The list view shows all articles (Decap can't filter it). The create
  # flow applies the template's defaults: pre-filled category and body
  # skeleton.
  # ============================================================

  - name: articles_template_mxgp
    label: '+ Uusi MXGP-juttu'
    label_singular: MXGP-juttu
    description: 'Luo uusi MXGP-juttu valmiilla pohjalla. Kategoria ja sisältörunko on esitäytetty. Selaa olemassa olevia artikkeleja Artikkelit-osiossa.'
    folder: src/content/articles
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
    i18n: true
    fields:
      - { name: title, label: Otsikko, widget: string, i18n: true }
      - { name: subtitle, label: Alaotsikko, widget: string, required: false, i18n: true }
      - { name: author, label: Kirjoittaja, widget: string, default: 'Photo & Moto', i18n: duplicate }
      - { name: date, label: Päivämäärä, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, i18n: duplicate }
      - { name: category, label: Kategoria, widget: hidden, default: 'MXGP', i18n: duplicate }
      - { name: tags, label: Avainsanat, widget: list, default: ['MXGP'], required: false, i18n: true }
      - { name: featured_image, label: 'Pääkuva (hero)', widget: image, required: false, i18n: duplicate }
      - { name: card_image, label: 'Korttikuva (lista- ja etusivut)', widget: image, required: false, i18n: duplicate }
      - { name: show_hero, label: 'Näytä pääkuva otsikon yläpuolella', widget: boolean, default: true, required: false, i18n: duplicate }
      - { name: image_caption, label: 'Pääkuvan kuvateksti', widget: string, required: false, i18n: true }
      - { name: draft, label: 'Piilota sivustolta', widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: seo_description, label: 'SEO-kuvaus (max 160 merkkiä)', widget: string, required: false, pattern: ['^.{0,160}$', 'Korkeintaan 160 merkkiä'], i18n: true }
      - name: body
        label: Sisältö
        widget: markdown
        i18n: true
        default: |
          [Avauskappale: mistä kilpailusta on kyse, missä, milloin, ketkä avainnimet]

          ## Kilpailun kulku

          [Kuvaus tärkeimmistä hetkistä — startti, käännekohdat, finaali]

          ## Tulokset

          | Sija | Kuljettaja | Tiimi | Pisteet |
          |---|---|---|---|
          | 1 |  |  |  |
          | 2 |  |  |  |
          | 3 |  |  |  |

          ## Yhteenveto

          [Mitä tämä tarkoittaa MM-sarjan kannalta?]
      - { name: sources, label: 'Lähteet (valinnainen)', widget: text, required: false, i18n: true }

  - name: articles_template_historical
    label: '+ Uusi historiallinen tarina'
    label_singular: Historiallinen tarina
    description: 'Luo uusi historiallinen tarina valmiilla pohjalla. Kategoria ja sisältörunko on esitäytetty. Selaa olemassa olevia artikkeleja Artikkelit-osiossa.'
    folder: src/content/articles
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
    i18n: true
    fields:
      - { name: title, label: Otsikko, widget: string, i18n: true }
      - { name: subtitle, label: Alaotsikko, widget: string, required: false, i18n: true }
      - { name: author, label: Kirjoittaja, widget: string, default: 'Photo & Moto', i18n: duplicate }
      - { name: date, label: Päivämäärä, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, i18n: duplicate }
      - { name: category, label: Kategoria, widget: hidden, default: 'Historical', i18n: duplicate }
      - { name: tags, label: Avainsanat, widget: list, default: ['historia'], required: false, i18n: true }
      - { name: featured_image, label: 'Pääkuva (hero)', widget: image, required: false, i18n: duplicate }
      - { name: card_image, label: 'Korttikuva (lista- ja etusivut)', widget: image, required: false, i18n: duplicate }
      - { name: show_hero, label: 'Näytä pääkuva otsikon yläpuolella', widget: boolean, default: true, required: false, i18n: duplicate }
      - { name: image_caption, label: 'Pääkuvan kuvateksti', widget: string, required: false, i18n: true }
      - { name: draft, label: 'Piilota sivustolta', widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: seo_description, label: 'SEO-kuvaus (max 160 merkkiä)', widget: string, required: false, pattern: ['^.{0,160}$', 'Korkeintaan 160 merkkiä'], i18n: true }
      - name: body
        label: Sisältö
        widget: markdown
        i18n: true
        default: |
          [Avauskappale: mistä ajanjaksosta on kyse ja miksi tarina on kertomisen arvoinen]

          ## Tausta

          [Mistä lähdettiin liikkeelle? Mikä oli ajan henki tai kontekst?]

          ## Tarina

          [Keskeiset tapahtumat ja henkilöt aikajärjestyksessä]

          ## Perintö

          [Mitä tämä jätti jälkeensä? Mitä siitä voi oppia tänään?]
      - { name: sources, label: 'Lähteet (valinnainen)', widget: text, required: false, i18n: true }

  - name: categories
    label: Kategoriat
    label_singular: Kategoria
    description: '⚠️ VAROITUS: Ennen kategorian poistamista, varmista että MIKÄÄN artikkeli ei käytä sitä. Jos poistat käytössä olevan kategorian, sitä käyttävät artikkelit jäävät rikkinäiseen tilaan (kategoriakenttä viittaa olemattomaan arvoon). Tarkista käyttö ennen poistoa: avaa artikkelilista ja varmista ettei yksikään artikkeli ole valitulla kategorialla. Vasta sitten poista.'
    folder: src/content/categories
    create: true
    delete: true
    extension: json
    format: json
    slug: '{{slug}}'
    identifier_field: label
    summary: '{{label}} ({{name}}) — TARKISTA KÄYTTÖ ENNEN POISTOA'
    fields:
      - { name: name, label: 'Tunniste (englanniksi, ei välilyöntejä)', widget: string, hint: '⚠️ ÄLÄ MUUTA TÄTÄ olemassa olevalle kategorialle — kaikki sitä käyttävät artikkelit lakkaavat näkymästä. Uudelle kategorialle: tämä arvo tallennetaan artikkelien tiedostoihin (esim. MXGP, Speedway, Historical).' }
      - { name: label, label: 'Näytettävä nimi', widget: string, hint: 'Tämä näkyy Decapin pudotusvalikossa, esim. Historiallinen, Tekninen. Tämän voit muuttaa milloin vain — se ei riko mitään.' }
